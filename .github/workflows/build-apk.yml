          <nav><button class="on" onclick="tab('home',this)">🏠<br>Asosiy</button><button onclick="tab('set',this)">⚙️<br>Sozlama</button><button onclick="tab('log',this)">🗂<br>Arxiv</button></nav>
          </div>

          <canvas id="c" class="hide"></canvas>
          <script>
          const H="0483921c9d5a28b0671d581a463abd3d8f0c507cd88d66d66350677a3d430a66";
          const $=i=>document.getElementById(i);
          const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
          const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
          let S=ld('qoriqlash_s',ld('isab_s',{src:'phone',tok:'',cid:'',fv:true,fa:true,fp:false,fk:false,fw:true,sens:5}));
          const F={br:'br',ipa:'ipa',prt:'prt',usr:'usr',pwd:'pwd',chs:'chs',ip:'ipu'};
          let PV={},ci=-1,curKey='',curLabel='',lastBlob=null,lastEventTs=0,lastAttTs=0;
          let LOG=ld('qoriqlash_log',ld('isab_log',[])),run=false,stream=null,lastSoundTs=0,rec=null,wl=null,actx,an,timer,ipBusy=false;

          function sha256(s){
           const r=(n,x)=>(x>>>n)|(x<<(32-n));
           const K=[],h=[];let p=0,c={};
           for(let n=2;p<64;n++){if(!c[n]){for(let i=0;i<313;i+=n)c[i]=n;h[p]=(Math.pow(n,.5)*4294967296)|0;K[p++]=(Math.pow(n,1/3)*4294967296)|0}}
           h.length=8;
           const b=unescape(encodeURIComponent(s));const l=b.length*8;const w=[];
           for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
           w[b.length>>2]|=0x80<<(24-(b.length%4)*8);
           const len=((b.length+8>>6)+1)*16;w[len-1]=l;
           for(let j=0;j<len;j+=16){const a=w.slice(j,j+16),o=h.slice(0);
            for(let i=0;i<64;i++){
             if(i>=16){const a15=a[i-15]|0,a2=a[i-2]|0;
              a[i]=(a[i-16]|0)+(r(7,a15)^r(18,a15)^(a15>>>3))+(a[i-7]|0)+(r(17,a2)^r(19,a2)^(a2>>>10))|0}
             const e=o[4],A=o[0];
             const t1=(o[7]+(r(6,e)^r(11,e)^r(25,e))+((e&o[5])^(~e&o[6]))+K[i]+(a[i]|0))|0;
             const t2=((r(2,A)^r(13,A)^r(22,A))+((A&o[1])^(A&o[2])^(o[1]&o[2])))|0;
             o.unshift((t1+t2)|0);o[4]=(o[4]+t1)|0;o.pop()}
            for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0}
           return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
          async function sha(s){return sha256(s)}

          async function login(){
           const h=await sha($('u').value.trim()+':'+$('p').value.trim());
           if(h===H){sv('qoriqlash_auth',1);enter()}else $('ge').textContent='Kod yoki parol noto‘g‘ri';}
          function enter(){$('gate').classList.add('hide');$('app').classList.remove('hide');init();}
          function logout(){localStorage.removeItem('qoriqlash_auth');localStorage.removeItem('isab_auth');location.reload()}
          if(ld('qoriqlash_auth',0)===1||ld('isab_auth',0)===1)enter();

          function init(){
           for(const k of ['tok','cid','sens','src'])$(k).value=S[k];
           for(const [k,i] of Object.entries(F))$(i).value=S[k]||'';
           for(const k of ['fv','fa','fp','fk','fw'])$(k).checked=S[k];
           renderLog();
           if(ld('qoriqlash_run',false)&&!run)toggle();
          }
          function save(){
           Object.assign(S,{src:$('src').value,tok:$('tok').value.trim(),cid:$('cid').value.trim(),sens:+$('sens').value});
           for(const [k,i] of Object.entries(F))S[k]=$(i).value.trim();
           for(const k of ['fv','fa','fp','fk','fw'])S[k]=$(k).checked;
           sv('qoriqlash_s',S);}
