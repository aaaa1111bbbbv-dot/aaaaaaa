name: Build Qoriqlash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p .github/workflows app/src/main/assets app/src/main/java/uz/qoriqlash/app app/src/main/res/values

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Qoriqlash"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.qoriqlash.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "uz.qoriqlash.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat <<'EOF' > app/proguard-rules.pro
          -keep class uz.qoriqlash.app.MainActivity$CameraBridge {
              @android.webkit.JavascriptInterface <methods>;
          }
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Qo‘riqlash</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Qo‘riqlash"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/MainActivity.kt
          package uz.qoriqlash.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat
          import okhttp3.Authenticator
          import okhttp3.Credentials
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.Route
          import java.util.concurrent.TimeUnit

          class MainActivity : ComponentActivity() {

              private lateinit var webView: WebView
              private var pendingPermissionRequest: PermissionRequest? = null

              private val requestPermissionsLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      pendingPermissionRequest?.let { req ->
                          req.grant(req.resources)
                          pendingPermissionRequest = null
                      }
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              val needed = arrayOf(
                                  Manifest.permission.CAMERA,
                                  Manifest.permission.RECORD_AUDIO
                              ).filter {
                                  ContextCompat.checkSelfPermission(this@MainActivity, it) != PackageManager.PERMISSION_GRANTED
                              }
                              if (needed.isEmpty()) {
                                  request.grant(request.resources)
                              } else {
                                  pendingPermissionRequest = request
                                  requestPermissionsLauncher.launch(needed.toTypedArray())
                              }
                          }
                      }

                      addJavascriptInterface(CameraBridge(this@MainActivity, this), "Android")
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)
                  ensureMediaPermissions()
              }

              private fun ensureMediaPermissions() {
                  val missing = arrayOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  ).filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      requestPermissionsLauncher.launch(missing.toTypedArray())
                  }
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }

              private class CameraBridge(
                  private val activity: ComponentActivity,
                  private val webView: WebView
              ) {
                  @JavascriptInterface
                  fun snap(id: Int, url: String, user: String, pass: String) {
                      Thread {
                          var b64Result = ""
                          try {
                              val clientBuilder = OkHttpClient.Builder()
                                  .connectTimeout(5, TimeUnit.SECONDS)
                                  .readTimeout(7, TimeUnit.SECONDS)

                              if (user.isNotEmpty() || pass.isNotEmpty()) {
                                  clientBuilder.authenticator(object : Authenticator {
                                      override fun authenticate(route: Route?, response: Response): Request? {
                                          if (response.request.header("Authorization") != null) return null
                                          val credential = Credentials.basic(user, pass)
                                          return response.request.newBuilder()
                                              .header("Authorization", credential)
                                              .build()
                                      }
                                  })
                              }

                              val client = clientBuilder.build()
                              val reqBuilder = Request.Builder().url(url).header("Cache-Control", "no-cache")
                              if (user.isNotEmpty() || pass.isNotEmpty()) {
                                  reqBuilder.header("Authorization", Credentials.basic(user, pass))
                              }

                              client.newCall(reqBuilder.build()).execute().use { resp ->
                                  if (resp.isSuccessful) {
                                      val bytes = resp.body?.bytes()
                                      if (bytes != null && bytes.isNotEmpty()) {
                                          b64Result = Base64.encodeToString(bytes, Base64.NO_WRAP)
                                      }
                                  }
                              }
                          } catch (_: Exception) {
                              b64Result = ""
                          }

                          val escaped = b64Result.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
                              webView.evaluateJavascript("window.onSnap($id, '$escaped');", null)
                          }
                      }.start()
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="uz"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#0b1020"><title>Qo‘riqlash</title>
          <style>
          :root{--bg:#0b1020;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#eef2ff;--mu:#8b95b5;--ac:#5b8cff;--ac2:#9b6bff;--ok:#2ee59d;--er:#ff5c7a}
          *{box-sizing:border-box;margin:0}
          body{font:16px system-ui,sans-serif;background:radial-gradient(900px 500px at 10% -10%,#1d2a5e,transparent),radial-gradient(700px 500px at 100% 0,#3a1d5e,transparent),var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 14px 90px}
          .card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(14px)}
          h1{font-size:22px}h2{font-size:15px;color:var(--mu);margin-bottom:10px;font-weight:600}
          input,select,textarea{width:100%;padding:13px;margin:5px 0;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.3);color:var(--tx);font-size:16px;font-family:inherit}
          textarea{min-height:76px;resize:vertical}
          button{padding:12px 16px;border:0;border-radius:12px;font-weight:600;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
          button.g{background:var(--card);border:1px solid var(--bd)}button.r{background:var(--er)}
          .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
          .st{font-size:13px;margin-top:6px;min-height:18px;color:var(--mu)}.ok{color:var(--ok)}.er{color:var(--er)}
          #gate{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
          #gate .card{width:100%;max-width:360px;text-align:center}
          .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:30px}
          .vid{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
          .vid video,.vid img{width:100%;height:100%;object-fit:cover}
          .dot{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.6);font-size:12px}
          nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(11,16,32,.9);backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
          nav button{flex:1;background:none;color:var(--mu);padding:8px 2px;font-size:12px}nav button.on{color:#fff;background:var(--card)}
          .sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
