          <select id="src" onchange="save()"><option value="phone">📱 Telefon kamerasi</option><option value="ip">📡 IP kameralar / NVR</option></select>
          <div class="row"><button class="g" onclick="testPhone()">Telefon kamerasini tekshirish</button></div><div class="st" id="s1

